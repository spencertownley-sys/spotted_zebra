# ─── LISTEN: your recordings ──────────────────────────────────────────
#
# 1. Upload the audio file (mp3 or m4a) into the  assets/music/  folder.
# 2. Add an entry below. "file" is just the file name.
#    Covers: add original_artist. Originals: leave it out.
#    note: anything short shown under the title ("Demo", "Live at ...").
# 3. Set "show" to true or false to show or hide a single song.
#
# Master switch: set  enabled: false  to hide the whole Listen section.
#
# Heads up: "show: false" hides a song from the site, but the file is still
# reachable by its direct link. To take a recording down completely,
# delete the file from assets/music/.
# ───────────────────────────────────────────────────────────────────────

enabled: true

songs:
  - title: "Under Your Spell"
    file: under-your-spell.mp3
    note: "Demo"
    show: true
  - title: "Dance"
    file: dance.mp3
    note: "Remix"
    show: true
  - title: "Is It Enough"
    file: is-it-enough.mp3
    note: "Mix 1"
    show: true
  - title: "Driving Fast to Nowhere"
    file: driving-fast-to-nowhere.mp3
    show: true
  - title: "Runnin' Hot"
    file: runnin-hot.mp3
    note: "Demo"
    show: true

