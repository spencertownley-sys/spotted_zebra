# ─── THE JUKEBOX: every song Spotted Zebra plays ──────────────────────
#
# This list powers the /jukebox/ page. One line per song.
#   yt: a YouTube video ID of us playing it (adds a "Watch us play it" button)
#   show: false hides a song without deleting it
# Move a song between decades by cutting and pasting its line.
# ───────────────────────────────────────────────────────────────────────

